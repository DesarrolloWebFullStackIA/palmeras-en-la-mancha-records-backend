services:
  - type: web
    name: palmeras-records-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: palmeras-records-db
          property: connectionString

databases:
  - name: palmeras-records-db
    plan: free
    region: frankfurt